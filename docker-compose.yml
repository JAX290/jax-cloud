services:
  app:
    build: .
    container_name: jax-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/jax.db
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: jax-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      # 节点面板反代端口：31001–31050（31000 + 节点 id），仅 Tailscale 内网使用
      # 整段映射一次到位，新增节点不需要再改这里
      - "31001-31050:31001-31050"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-cloud.jax.markets}
      # 主控 Tailscale 地址：换服务器只改 .env 里的 PANEL_HOST
      PANEL_HOST: ${PANEL_HOST:-100.124.251.8}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-nodes:/etc/caddy/nodes:ro
      - ./caddy-snippets:/etc/caddy/snippets:ro
      - ./media:/srv/media:ro
      - ./backups:/srv/backups:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
